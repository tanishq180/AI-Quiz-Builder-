version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: quizverse_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - quizverse_net

  redis:
    image: redis:7-alpine
    container_name: quizverse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - quizverse_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quizverse_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/ai_quiz_builder
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost:5173
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb
      - redis
    networks:
      - quizverse_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quizverse_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - quizverse_net

networks:
  quizverse_net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
